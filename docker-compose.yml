services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: filacero
      POSTGRES_PASSWORD: filacero_local
      POSTGRES_DB: filacero
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - filacero_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filacero -d filacero"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  filacero_pg:
